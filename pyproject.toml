[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisinger"
version = "0.1.0"
description = "Make any voice sing any song: vocal separation, voice cloning (RVC / Seed-VC) and natural-sounding remixing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "audio-separator>=0.40",
    "audioread",
    "pedalboard>=0.9",
    "soundfile",
    "numpy",
    "uv>=0.5",
]

[project.optional-dependencies]
gpu = ["audio-separator[gpu]>=0.40"]
cpu = ["audio-separator[cpu]>=0.40"]

[project.scripts]
aisinger = "aisinger.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["aisinger*"]
